<!DOCTYPE html>
<html lang="es">
<head>

<title>Simulador AmbulancePad · SUC (formación)</title>
<style>
:root{--bg:#c7ccd2;--row:#e9ebee;--row2:#d5d9de;--ink:#1b2430;--muted:#5d6875;--top:#3b3f45;--navy:#253e66;--red:#c8423b;--green:#3cb34a;--or:#f08c1e;--blue:#9cc1e8;--line:#a9b1ba}
*{box-sizing:border-box}
html,body{margin:0;background:#2a2d31;color:var(--ink);font:15px/1.35 "Segoe UI",Tahoma,system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #9aa3ad;border-radius:2px;background:#fff;width:100%;color:var(--ink)}
input:disabled,textarea:disabled,select:disabled{background:#eceef0;color:#555}
#dev{max-width:1180px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;position:relative}
.disc{background:#fff4e0;color:#7a4a00;font-size:12px;padding:4px 10px;text-align:center}
/* top bar */
.top{background:var(--top);color:#fff;display:flex;align-items:center;gap:8px;padding:5px 8px;position:sticky;top:0;z-index:40;min-height:44px}
.tb{border:0;background:transparent;color:#fff;padding:3px 6px;border-radius:3px;font-size:20px;line-height:1}
.tb.env{color:#4cd964}.tb.ok{color:#4cd964;font-size:24px}
.tb.srch{background:#d9534f;width:60px;font-size:17px}
.tb.card{background:#e8e8e8;color:#555;width:44px;font-size:14px}
.tb.x{background:#d9534f;font-weight:700;width:44px}
.top .name{font-weight:600;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .inc{font-weight:600}
.top .tm{font-family:Consolas,monospace;font-size:13px;opacity:.9}
.sig{font-size:13px;color:#4cd964;border:0;background:transparent}
.sig.off{color:#ff6b6b}
#ban{position:sticky;top:44px;z-index:39}
.banner{background:var(--red);color:#fff;padding:8px 12px;font-weight:600;cursor:pointer;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{background:#8f221c}}
main{flex:1;padding:6px 6px 90px}
/* rows */
.r{display:grid;grid-template-columns:28px 220px 1fr minmax(160px,34%) 60px;align-items:stretch;background:linear-gradient(#f3f4f6,#d9dce0);border-bottom:3px solid #4a4f56;min-height:62px;cursor:pointer}
.r .st{background:var(--or);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.r.ok .st{background:var(--green)}
.r .tt{padding:6px 8px;display:flex;flex-direction:column;justify-content:center}
.r .tt b{font-size:15px;letter-spacing:.2px}
.r .tt span{font-size:14px;color:#333}
.r .q{display:flex;gap:6px;align-items:center;padding:4px;flex-wrap:wrap}
.r .sm{margin:6px 6px;background:#fafafa;border:1px solid #9aa3ad;font:12px Consolas,monospace;color:#666;padding:4px 6px;overflow:hidden;white-space:pre-wrap;max-height:52px}
.r .ic{display:grid;place-items:center;margin:4px;border-radius:4px;color:#fff;font-weight:700;font-size:22px;background:var(--navy)}
.r .ic.rd{background:#fff;color:var(--red);border:3px solid var(--red)}
.r .ic.gr{background:#fff;color:#1f4d2b;border:3px solid #2e5e3a}
.r.open{border-bottom:0}
.panel{background:#e4e6e9;border-bottom:3px solid #4a4f56;padding:6px 10px 14px 34px;position:relative}
@media(max-width:760px){
 .r{grid-template-columns:22px 1fr 50px;grid-template-areas:"st tt ic" "st q q" "st sm sm"}
 .r .st{grid-area:st}.r .tt{grid-area:tt}.r .q{grid-area:q}.r .sm{grid-area:sm;max-height:40px}.r .ic{grid-area:ic;font-size:18px}
 .panel{padding:6px 6px 14px 26px}
}
.hd{background:#2f3338;color:#fff;font-size:15px;padding:3px 8px;margin:10px 0 0}
.box{border:1px solid #8f979f;border-top:0;background:#eef0f2;padding:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
.ck{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 8px;border:1px solid #d9772c;background:linear-gradient(#f7a868,#ee8a3c);text-align:center;font-size:14px;color:#3a1d05;border-radius:1px}
.ck.blue{border-color:#5f8bc0;background:linear-gradient(#b3cfee,#86aedb);color:#16365e}
.ck.grey{border-color:#a7aeb6;background:linear-gradient(#e4e6e9,#c9cdd2);color:#333}
.ck::before{content:"";flex:none;width:15px;height:15px;border:2px solid #555;background:#fff;box-shadow:inset 1px 1px 0 #999}
.ck span{flex:1}
.ck.on{background:linear-gradient(#8af46a,#52d634);border-color:#2f9a1d;color:#0b2a05;font-weight:600}
.ck.on::before{content:"✕";font-weight:900;font-size:13px;line-height:12px;text-align:center;color:#000;background:#fff}
.ck:disabled{opacity:.75;cursor:default}
.ck.sm{min-height:38px;min-width:120px}
.bb{border:1px solid #6d8fb8;background:linear-gradient(#b8d3ef,#8db3dc);color:#25456b;min-height:44px;padding:4px 10px;border-radius:1px}
.bb.dk{background:linear-gradient(#3d5778,#253e66);color:#fff;border-color:#1c2f4d}
.bb:disabled{opacity:.5;cursor:default}
.plus{background:var(--blue);border:0;color:var(--or);font-size:30px;font-weight:700;min-width:80px}
.plus.dk{background:#2c4568}
.frm{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;align-items:center}
.frm label{font-size:14px;color:#222}
@media(max-width:760px){.frm{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.times{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:760px){.times{grid-template-columns:repeat(2,1fr)}}
.tbx label{font-size:13.5px;display:block}
.tbx .t{display:flex;gap:3px}
.clk{border:1px solid #9aa3ad;background:linear-gradient(#e8e8e8,#cfcfcf);width:44px;font-size:18px;border-radius:50%}
.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:4px 6px;border-bottom:1px solid #d6dade}
.tbl th{background:#e9ecef;font-weight:600}
.logw{display:flex;gap:0;border:1px solid #8f979f;background:#fff;min-height:90px}
.logw .lt{flex:1;overflow:auto}
.note{position:absolute;right:8px;bottom:8px;width:52px;height:46px;border:0;border-radius:4px;background:#3a7bd5;color:#fff;font-size:22px}
.tip{background:#eaf3ff;border-left:4px solid #3a7bd5;padding:6px 9px;font-size:13.5px;margin:8px 0}
.warn{background:#fdecea;border-left:4px solid var(--red);padding:6px 9px;font-size:13.5px;margin:8px 0}
.small{font-size:12.5px;color:var(--muted)}
.vrow{display:grid;grid-template-columns:60px 1fr;border-bottom:1px solid #b9c0c7}
.vrow>.c{display:grid;place-items:center;color:#fff;font-size:20px}
.vrow .f{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px}
.vrow .f input{width:80px}
.vrow .f .lab{min-width:70px;font-size:14px}
/* bottom */
.bar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:#3b3f45;pointer-events:none}
.bar .in{display:flex;gap:6px;overflow-x:auto;max-width:1180px;width:100%;padding:6px;pointer-events:auto}
.bar button{flex:1 0 auto;min-width:118px;border:1px solid #888;background:linear-gradient(#f2f2f2,#cfd2d6);padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:14px;text-align:left;border-radius:1px}
.bar button b{font-size:22px;font-weight:400}
.bar button.g{background:linear-gradient(#a5d18f,#7cb465)}
.bar button:disabled{opacity:.45}
.side{position:fixed;right:max(6px,calc(50% - 590px + 6px));top:120px;display:flex;flex-direction:column;gap:6px;z-index:20}
.side button{width:42px;height:38px;border:0;background:#cfd3d8;font-size:18px;border-radius:3px}
@media(max-width:900px){.side{display:none}}
/* home */
.hhead{display:grid;grid-template-columns:180px 1fr 1fr;gap:10px;background:#2f3338;color:#fff;padding:8px}
@media(max-width:760px){.hhead{grid-template-columns:1fr}}
.hhead .vd{background:linear-gradient(#f2f2f2,#cfd2d6);color:#222;border:0;display:flex;align-items:center;gap:8px;padding:6px;font-size:15px}
.hhead .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14.5px}
.list{background:#e8eaed;min-height:300px;margin-top:6px}
.list table{width:100%;border-collapse:collapse;font-size:14.5px}
.list th{text-align:left;font-weight:400;color:#333;padding:6px;border-bottom:2px solid #b5bcc4;background:#dfe2e6}
.list td{padding:8px 6px;border-bottom:1px solid #cdd2d8;white-space:nowrap}
.list tr.sel td{background:#2a7fd4;color:#fff}
.list tr{cursor:pointer}
.trainer{background:#fff;border:2px dashed #7a8794;margin:10px 6px;padding:10px}
.trainer h3{margin:0 0 6px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

#mod{position:fixed;inset:0;z-index:60;background:rgba(10,15,20,.55);display:none;align-items:center;justify-content:center}
#mod.show{display:flex}
#mod .w{background:#e4e6e9;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;border:2px solid #222}
#mod .h{display:flex;align-items:center;gap:6px;background:#3b3f45;color:#fff;padding:6px 8px;font-weight:600}
#mod .h span{flex:1}
#mod .h button{border:0;width:44px;height:34px;font-size:18px;color:#fff}
#mod .b{overflow:auto;padding:8px 12px 16px}
@media(max-width:760px){#mod .w{height:100%;max-height:100%}}
canvas.sg{width:100%;height:130px;background:#fff;border:1px dashed #888;touch-action:none;display:block}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#14202e;color:#fff;padding:9px 14px;border-radius:6px;font-size:14px;z-index:90;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.incoming{background:#fff;border:4px solid var(--red);padding:12px;margin:8px 6px;animation:pl 1.2s infinite}

.report h1{font-size:18px;margin:0}
.report h4{background:#e9ecef;margin:12px 0 4px;padding:3px 8px;font-size:13px}
.report .rh{display:flex;justify-content:space-between;gap:10px;border-bottom:3px solid var(--navy);padding-bottom:8px}

.report img{max-width:150px;margin:3px}
.kv2{display:grid;grid-template-columns:minmax(120px,36%) 1fr;gap:2px 10px}
.kv2 b{font-weight:500;color:#555}
pre.xml{background:#14202e;color:#cde3f7;padding:10px;overflow:auto;font-size:12px;max-height:55vh}
.lock{background:#555;color:#fff;padding:6px 10px;font-size:13.5px}
.eye{width:74px;height:50px;border-radius:50%;border:2px solid #777;background:radial-gradient(circle,#222 0 var(--p,9px),#8a6a4a calc(var(--p,9px) + 1px) 15px,#f6f6f6 16px);position:relative}
.eye i{position:absolute;right:-4px;bottom:-6px;font-style:normal;font-weight:800;font-size:18px}

.bodyw{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.bodyw svg [data-r]{cursor:pointer;stroke:#3b3f45;stroke-width:1.4}

.scq{font:700 22px Consolas,monospace;color:#c8423b}
.dxsel{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:760px){.dxsel{grid-template-columns:1fr}}
.logm{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}.logm>div{flex:1;min-width:150px;background:#dbe6f3;border:1px solid #9fb3cc}

.crew button{text-align:left;padding:5px 8px;border:1px solid #9fb3cc;background:#fff;font-size:13px}.crew button.on{background:#2a7fd4;color:#fff}
.yellow textarea{background:#ffff66}
.arrow{font-size:26px;min-width:56px;min-height:44px;border:1px solid #6d8fb8;background:linear-gradient(#b8d3ef,#8db3dc)}.arrow.on{background:linear-gradient(#8af46a,#52d634)}
.gstep{display:grid;grid-template-columns:28px 1fr auto;gap:6px;align-items:center;padding:6px;border-bottom:1px solid #cdd3da;background:#fff}
.gstep.ok{background:#eaf7e6}.gstep .n{font:700 13px Consolas;color:#555}
</style>

function done0(p,s){
 if(s.noReq)return true;
 const d=p.d;
 switch(s.id){
  case 'equipo':return S.shift.crew.length>0;
  case 'incidente':return filled(d.calle)&&filled(d.hLlegada);
  case 'paciente':return p.sp.niegaDatos||((filled(d.apellidos)||d.desconocido)&&filled(d.edad)&&filled(d.sexo));
  case 'anam':return filled(d.anam);
  case 'vd':case 'rd':return filled(d[s.id+'_avdn']);
  case 'vit':return p.vitals.length>0||d.vitNoReq||d.vitRech;
  case 'diag':return dxAny(p);
  case 'mec':return (p.o.mec||[]).length>0||filled(d.mecPel)||filled(d.mecTxt);
  case 'apgar':return d.apgarTot!==undefined;
  case 'exitus':return filled(d.exHora)&&!!p.sig.exitus;
  case 'tras':return filled(d.destino);
  case 'ent':return ['Domicilio','No traslado','Traslado por otro recurso'].includes(d.destino)||(filled(d.recibe)&&filled(d.hTransf));
 }
 if(s.opt){const k=s.id;return (p.o[k]||[]).length>0||Object.keys(p.logs).some(l=>(OPT[optKey(k)]||[]).some(g=>g.log===l)&&p.logs[l].length)||filled(d['ft_'+k])}
 return true;
}
function summary0(p,s){
 const d=p.d;
 switch(s.id){
  case 'equipo':return `${S.shift.veh} (${S.shift.veh}), ${S.shift.est}`;
  case 'incidente':return [d.calle,d.num,d.pob].filter(Boolean).join(' ').toUpperCase();
  case 'paciente':return '';
  case 'anam':return d.anam||'';
  case 'vd':case 'rd':{const g=gcs(p,s.id);return [d[s.id+'_avdn'],g?`GCS: ${g}(${d[s.id+'_go']}/${d[s.id+'_gv']}/${d[s.id+'_gm']})  a ${d[s.id+'_gh']||''}`:''].filter(Boolean).join('\n')}
  case 'vit':{const v=p.vitals.at(-1);return v?`${v.h} TA ${v.tas||'-'}/${v.tad||'-'} FC ${v.fc||'-'} FR ${v.fr||'-'} SpO2 ${v.spo2||'-'}%`:(d.vitNoReq?'valores medidos no requeridos':d.vitRech?'Rechazado por el paciente':'')}
  case 'diag':return dxAll(p);
  case 'mec':return [...(p.o.mec||[]).map(lab),d.mecEv?'Evento '+d.mecEv:'',d.mecPel?'Peligros: '+d.mecPel:''].filter(Boolean).join(', ');
  case 'rn':return ['rnEG','rnPeso','rnParto','rnApgar'].map(k=>d[k]).filter(Boolean).join(' · ')||(p.o.rn||[]).join('');
  case 'triage':return (p.logs.triage||[]).map(e=>e.txt).join(' | ')||(p.o.triage||[]).join('');
  case 'apgar':return d.apgarTot!==undefined?'APGAR '+d.apgarTot:'';
  case 'exitus':return d.exHora?'Exitus '+d.exHora+(d.exTipo?' · '+d.exTipo:''):'';
  case 'reg':return p.vitals.length?p.vitals.length+' tomas · '+Object.values(p.logs).flat().length+' intervenciones':'';
  case 'tras':return d.destino||'';
  case 'ent':return [d.recibe,d.hTransf].filter(Boolean).join(' · ');
 }
 const sel=(p.o[s.id]||[]);const logs=(OPT[optKey(s.id)]||[]).filter(g=>g.log).flatMap(g=>(p.logs[g.log]||[]).map(e=>e.h+' '+e.txt));
 return [...sel.map(lab),...logs].join(', ')+(d['ft_'+s.id]?(sel.length?' | ':'')+d['ft_'+s.id]:'')||'';
}
function gcs(p,id='vd'){const d=p.d;return d[id+'_go']&&d[id+'_gv']&&d[id+'_gm']?(+d[id+'_go'])+(+d[id+'_gv'])+(+d[id+'_gm']):0}
function dxText0(p){const d=p.d;const c=k=>{const x=CIE.find(c=>c[0]===d[k]);return x?`CIE9: ${x[0]} (${x[1]})`:''};let t='';if(d.dx1)t+=`Diagnóstico principal (${d.dx1c||'Asegurado'}): ${c('dx1')}`;if(d.dx2)t+=` | Diagnóstico secundario: ${c('dx2')}`;return t}
function dxAny(p){const d=p.d;return filled(d.dx1)||filled(d.dxLibre)||(p.o.dxEnf||[]).length>0||(p.les||[]).length>0||(p.burns||[]).length>0||(p.frost||[]).length>0}
function scq(p){return (p.burns||[]).filter(b=>b.g!=='1º').reduce((s,b)=>s+(+b.pct||0),0)}
function dxAll(p){const d=p.d,t=[];if((p.o.dxEnf||[]).length)t.push('Enfermedad: '+p.o.dxEnf.join(', '));const c=dxText(p);if(c)t.push(c);if(d.dxLibre)t.push('Conclusión: '+d.dxLibre);
 if((p.les||[]).length)t.push('Lesiones: '+p.les.map(l=>`${l.r} – ${l.t}${l.ab?' ('+l.ab+')':''}${l.g?' ['+l.g+']':''}`).join('; '));
 if((p.burns||[]).length)t.push(`Quemaduras: SCQ ${scq(p)}% · `+p.burns.map(b=>`${b.r} ${b.pct}% ${b.g}`).join('; ')+(d.burnAg?' · agente '+d.burnAg:''));
 if((p.frost||[]).length)t.push('Congelación: '+p.frost.map(f=>`${f.r} ${f.g}`).join('; '));return t.join('\n')}
function prenotifNeed(p){const k=PRENOTIF_CIE[p.d.dx1]||(has(p,'vecg','SCACEST')?'SCACEST':null);return k&&!p.prenotif?k:null}

  return `<div class="cols"><div><div class="hd">Lugar del Incidente</div><div class="box frm"><label>CP/Población:</label><div style="display:flex;gap:4px"><input data-k="cp" value="${esc(d.cp)}" style="width:80px" ${D}><input data-k="pob" value="${esc(d.pob)}" ${D}></div><label>Nº Calle:</label><div style="display:flex;gap:4px"><input data-k="calle" value="${esc(d.calle)}" ${D}><input data-k="num" value="${esc(d.num)}" style="width:60px" ${D}></div><label>Instalación:</label><input data-k="inst" value="${esc(d.inst)}" ${D}><label>Parte objeto/Sito:</label><input data-k="sito" value="${esc(d.sito)}" ${D}><label></label><textarea data-k="notas" rows="2" ${D}>${esc(d.notas)}</textarea><label>Descripción:</label><select data-k="desc" ${D}>${['','Domicilio','Vía pública','Lugar de trabajo','Centro sanitario','Residencia','Lugar público','Parque infantil','Playa','Carretera'].map(o=>`<option ${d.desc===o?'selected':''}>${o}</option>`).join('')}</select><label>Primero en escena:</label><input data-k="primero" value="${esc(d.primero)}" ${D}><label>Conducción:</label><select data-k="prioritarios" ${D}>${['','Con prioritarios','Sin prioritarios'].map(o=>`<option ${d.prioritarios===o?'selected':''}>${o}</option>`).join('')}</select></div>
  <div class="hd">Dirección de inicio</div><div class="box"><input data-k="inicio" value="${esc(d.inicio)}" ${D}></div></div>
  <div><div class="hd">Información Adicional del Incidente</div><div class="box frm"><label>Nº Afectado/Nº Incidente:</label><div style="display:flex;gap:4px"><input value="${p.inc}" disabled><input value="${p.afe}" disabled></div><label>Fecha del Incidente:</label><input value="${p.fecha}" disabled><label>Tipo Llamada:</label><select data-k="tipoLl" ${D}>${['','Enfermedad','Accidente de tráfico','Accidente casual','Agresión','Intoxicación','Parto','Traslado interhospitalario','Otros'].map(o=>`<option ${d.tipoLl===o?'selected':''}>${o}</option>`).join('')}</select><label>Razón del transp.:</label><input data-k="razon" value="${esc(d.razon)}" ${D}><label>Prioridad:</label><select data-k="prio" ${D}>${['','EM','UR','NU'].map(o=>`<option ${d.prio===o?'selected':''}>${o}</option>`).join('')}</select><label>Palabra clave:</label><input value="${esc(d.kw)}" disabled><label>Información de la Sala:</label><textarea rows="2" disabled>${esc(d.sosp)}</textarea><label>Expedido por:</label><input data-k="expedido" value="${esc(d.expedido)}" ${D}></div></div></div>
  <div class="hd">Hora</div><div class="box times">${T('hInc','Hora de Incidente')}${T('hActiv','Activación')}${T('hMov','Movilización')}${T('hLlegada','Llegada al lugar')}${T('hAsist','Asistencia')}${T('hTransp','Transporte')}${T('hHosp','Llegada')}${T('hFin','Finalización')}</div>`},
 paciente(p){const d=p.d,D='',F=(k,l,t='')=>`<label>${l}</label><input data-k="${k}" value="${esc(d[k])}" ${t}>`;const imc=d.peso&&d.altura?(d.peso/Math.pow(d.altura/100,2)).toFixed(1):'';
  return `<div class="cols"><div><div class="hd">Dirección Paciente</div><div class="box frm">${F('pcp','CP/Población:')}${F('pcalle','Nº Calle:')}${F('ppais','País/Provincia:')}${F('fn','FN:','type="date"')}<label>Género:</label><input value="${esc(d.sexo)}" disabled>${F('nac','Nacionalidad:')}${F('tel','Núm. de teléfono:')}${F('tutor','Tutor:')}${F('contacto','Nombre de contacto:')}${F('origen','Origen:')}<label></label><button class="bb" data-act="copyAddr">⧉ Copiar Dirección Llamada</button></div>
  <div class="hd">Información Adicional Paciente</div><div class="box frm">${F('altura','Altura Paciente (cm)','type="number"')}${F('peso','Peso Paciente (kg)','type="number"')}<label>IMC:</label><input value="${imc}" disabled><label></label><div style="display:flex;gap:4px">${ck(p,'x','Tutor avisado',{on:!!d.tutorAv,dis:false}).replace('data-opt="1"','data-act="tutorAv"')}<button class="bb" data-act="mod" data-m="tutor">Autorización de tratamiento</button></div></div></div>
  <div><div class="hd">Seguro</div><div class="box frm">${F('seguro','Seguro / Compañía')}${F('nseg','Nº Seguro Médico')}${F('nhc','NHC / Cód. ingreso')}${F('doc','DNI/Pasaporte')}<label>Tipo de documento</label><select data-k="tdoc">${['','DNI','NIE','Pasaporte','Tarjeta sanitaria','Sin documento'].map(o=>`<option ${d.tdoc===o?'selected':''}>${o}</option>`).join('')}</select><label>Tipo de seguro</label><select data-k="tseg">${['','Servicio Canario de la Salud','Mutua','Seguro privado','Accidente de tráfico','Accidente laboral','Sin seguro'].map(o=>`<option ${d.tseg===o?'selected':''}>${o}</option>`).join('')}</select></div>
  <div class="hd">Facturación-Otros</div><div class="box"><button class="bb" data-act="clearCard">▭✕ Borrar/Actualizar</button></div></div></div><p class="small">Los datos administrativos (nombre, edad, documento…) se pueden completar incluso con el registro cerrado.</p>`},
 anam(p){return `<div class="hd">Descripción de la anamnesis</div><div class="box" style="display:flex;gap:6px"><textarea data-k="anam" rows="7" style="flex:1" ${dis(p)}>${esc(p.d.anam)}</textarea><div style="display:flex;flex-direction:column;gap:4px">${p.closed?'':`<button class="bb" data-act="mod" data-m="macros" style="font-size:18px;font-weight:700">a<sub>c</sub>b</button>`}</div></div>`},
 vd:neuroPanel,rd:neuroPanel,
 vit(p){const d=p.d,D=dis(p),I=(k,u,w=80)=>`<input type="number" data-k="f_${k}" value="${esc(d['f_'+k])}" style="width:${w}px" ${D}> ${u}`,C=(k,l)=>ck(p,'vitf',l,{on:!!d['f_'+k]}).replace('data-opt="1"',`data-act="vitChk" data-k="f_${k}"`);
  const mapa=d.f_tas&&d.f_tad?Math.round((+d.f_tas+2*d.f_tad)/3):'';const conn=S.shift.dev.zoll?.st==='on';
  return `${p.closed?'':`<div style="display:flex;gap:6px;margin:6px 0;flex-wrap:wrap"><button class="bb dk" data-act="importMon" ${conn?'':'disabled'}>⇩ Datos del monitor ZOLL</button>${conn?'':'<span class="small">Conecta el ZOLL (botón «Conectar») para importar.</span>'}</div>`}
  <div class="vrow"><div class="c" style="background:#e04b3c">❤</div><div class="f"><span class="lab">Tensión:</span>${I('tas','/',70)} ${I('tad','mmHg',70)} <span>MAPA: <b>${mapa}</b></span>${C('brIz','brazo izquierdo')}${C('brDe','brazo derecho')}<br><span class="lab">IBP:</span>${I('ibs','/',70)} ${I('ibd','mmHg',70)} ${C('palp','palpación')}${C('dif','Presente diferencia')}<br><span class="lab">Pulso:</span>${I('pulso','/min')} <span>HR:</span>${I('hr','/min')} ${C('reg','regular')}${C('irr','irregular')}</div></div>
  <div class="vrow"><div class="c" style="background:#39b54a">🫁</div><div class="f"><span class="lab">FR:</span>${I('fr','/min')}<br><span class="lab">SpO₂</span>${I('spo2','%')} ${C('o2','Con Oxígeno')}<br><span class="lab">etCO₂</span>${I('etco2','mmHg')} CO₂ ${I('co2','%',60)} MetHb ${I('methb','%',60)} COHb ${I('cohb','%',60)}</div></div>
  <div class="vrow"><div class="c" style="background:#3f51b5">🕒</div><div class="f"><span class="lab">Gl.</span>${I('gl','mg/dl')} ${C('hipo','Hipoglucemia')}${C('hiper','Hiperglucemia')}<br><span class="lab">Temp:</span>${I('temp','°C')} ${C('oido','en oído')}${C('boca','en boca')}${C('rect','rectal')}<br><span class="lab">Dolor:</span>${[...Array(11).keys()].map(n=>`<button class="ck sm ${String(d.f_dolor)===String(n)?'on':''}" style="min-width:52px" data-act="dolor" data-v="${n}" ${D}><span>${n}</span></button>`).join('')}</div></div>
  <div style="display:flex;gap:6px;margin-top:6px">${ck(p,'x','valores medidos no requeridos',{on:!!d.vitNoReq}).replace('data-opt="1"','data-act="flag" data-k="vitNoReq"')}${ck(p,'x','Rechazado por el paciente',{on:!!d.vitRech}).replace('data-opt="1"','data-act="flag" data-k="vitRech"')}</div>
  ${p.closed?'':'<div style="margin:8px 0"><button class="bb dk" data-act="vitAdd">➜ Intro Datos de Tabla</button></div>'}
  <div class="hd">Tomas registradas (${p.vitals.length})</div><div class="box" style="overflow-x:auto">${vitTable(p,!p.closed)}</div>`},
 diag(p){const d=p.d,D=dis(p),m=S.dxMode;
  const sel=(k,l)=>ck(p,'x',l,{on:m===k,dis:false}).replace('data-opt="1"',`data-act="dxMode" data-v="${k}"`);
  let h=`<div class="hd">Resumen</div><div class="box" style="font-size:14.5px;min-height:60px;white-space:pre-line;background:#fff">${esc(dxAll(p))||'<span class="small">Sin diagnóstico.</span>'}</div>`;
  h+=`<div class="hd">Diagnóstico, seleccionar tipo</div><div class="box dxsel"><div><div class="small"><b>Enfermedad</b></div>${sel('enf','Enfermedad')}${sel('cie','CIE9')}${sel('libre','Diagnóstico libre/Conclusión')}</div><div><div class="small"><b>Trauma</b></div>${sel('les','Lesiones')}${sel('quem','Quemadura/Escaldadura')}${sel('cong','Congelación')}</div></div>`;
  if(m==='enf')h+=`<div class="hd">Enfermedad (categoría)</div><div class="box grid">${ENF.map(v=>ck(p,'dxEnf',v)).join('')}</div>`;
  if(m==='cie')h+=cieHTML(p);
  if(m==='libre')h+=`<div class="hd">Diagnóstico libre / Conclusión</div><div class="box"><textarea data-k="dxLibre" rows="4" ${D}>${esc(d.dxLibre)}</textarea></div>`;
  if(m==='les')h+=lesHTML(p);
  if(m==='quem')h+=burnHTML(p);
  if(m==='cong')h+=frostHTML(p);
  return h},
 mec(p){const d=p.d,D=dis(p);return `<div class="tip">Opciones de mecanismo reconstruidas para el simulador (la ventana interna del botón 🚗 no estaba en las fotos). Los campos Evento, Peligros y encontrados son los reales.</div>
  <div class="hd">Razón</div><div class="box"><div class="cols"><div class="frm"><label>Peligros:</label><input data-k="mecPel" value="${esc(d.mecPel)}" placeholder="p. ej. tráfico activo, combustible" ${D}><label>encontrados:</label><input data-k="mecEnc" value="${esc(d.mecEnc)}" placeholder="p. ej. casco roto, airbag" ${D}></div><textarea data-k="mecTxt" rows="3" placeholder="Descripción del mecanismo" ${D}>${esc(d.mecTxt)}</textarea></div></div>
  ${Object.entries(MEC).map(([g,o])=>`<div class="hd">${g}</div><div class="box grid">${o.map(v=>ck(p,'mec',v)).join('')}</div>`).join('')}
  <div class="frm" style="margin-top:6px"><label>Velocidad estimada (km/h)</label><input type="number" data-k="mecVel" value="${esc(d.mecVel)}" ${D}><label>Altura de caída (m)</label><input type="number" data-k="mecAlt" value="${esc(d.mecAlt)}" ${D}></div>
  ${(p.o.mec||[]).length?'<div class="warn">Mecanismo registrado. Si es de alta energía, valora los criterios de activación del Código Politrauma del protocolo del SUC y la prenotificación al hospital útil.</div>':''}`},
 rn(p){const d=p.d,D=dis(p),T=(k,l)=>`<div class="hd">${l}</div><div class="box"><textarea data-k="${k}" rows="2" ${D}>${esc(d[k])}</textarea></div>`;
  return `<div class="cols"><div>${T('rnEG','Edad gestacional')}${T('rnPeso','Peso/tamaño')}${T('rnParto','Parto')}${T('rnOtros','Otros eventos')}<div class="hd">APGAR SCORE</div><div class="box" style="display:flex;gap:6px"><input data-k="rnApgar" value="${esc(d.rnApgar)}" ${D}><button class="bb" data-act="mod" data-m="apgarRN" ${D}>Calcular</button></div></div>
  <div><div class="hd">Detalles</div><div class="box frm"><label>Hora de inicio de síntoma:</label><div style="display:flex;gap:4px"><button class="clk" data-act="now" data-k="rnHora" ${D}>🕒</button><input type="time" data-k="rnHora" value="${esc(d.rnHora)}" ${D}></div></div></div></div>`},
 triage(p){return `<div class="hd">TRIAGE (Start)</div><div class="box">${logHTML(p,'triage')}<div style="margin-top:6px"><button class="bb dk" data-act="mod" data-m="start" ${dis(p)}>Asistente START</button> <span class="small">Calcula el color y lo añade a la tabla.</span></div></div>`},
 apgar(p){const d=p.d;const items=[['Color',['Cianosis/palidez','Acrocianosis','Rosado']],['Frecuencia cardiaca',['Ausente','< 100','≥ 100']],['Reflejos',['Sin respuesta','Mueca','Llanto/tos']],['Tono muscular',['Flácido','Flexión leve','Movimiento activo']],['Respiración',['Ausente','Débil/irregular','Llanto fuerte']]];
  return `<div class="tip">Sección añadida por el protocolo SVA NEONATO (aproximación del simulador).</div>${items.map(([k,o],ix)=>`<div class="hd">${k}</div><div class="box grid">${o.map((t,i)=>ck(p,'x',i+' · '+t,{on:d['ap'+ix]===i}).replace('data-opt="1"',`data-act="apgar" data-i="${ix}" data-v="${i}"`)).join('')}</div>`).join('')}<p style="font-size:22px;font-weight:700">APGAR: ${d.apgarTot??'—'}/10</p>
  <div class="frm"><label>Minuto</label><select data-k="apMin" ${dis(p)}>${['1','5','10'].map(o=>`<option ${d.apMin===o?'selected':''}>${o}</option>`).join('')}</select><label>Peso estimado (g)</label><input type="number" data-k="nPeso" value="${esc(d.nPeso)}" ${dis(p)}><label>Semanas de gestación</label><input type="number" data-k="nSem" value="${esc(d.nSem)}" ${dis(p)}></div>`},
 exitus(p){const d=p.d,D=dis(p);return `<div class="tip">Sección añadida por el protocolo SVA EXITUS (aproximación del simulador).</div><div class="frm"><label>Hora del exitus</label><div style="display:flex;gap:4px"><button class="clk" data-act="now" data-k="exHora" ${D}>🕒</button><input type="time" data-k="exHora" value="${esc(d.exHora)}" ${D}></div><label>Lugar</label><input data-k="exLugar" value="${esc(d.exLugar)}" ${D}><label>Tipo de muerte</label><select data-k="exTipo" ${D}>${['','Natural','No natural','Desconocida'].map(o=>`<option ${d.exTipo===o?'selected':''}>${o}</option>`).join('')}</select><label>Detectado por</label><select data-k="exDet" ${D}>${['','Médico de urgencias','Médico privado','Emergenciólogo'].map(o=>`<option ${d.exDet===o?'selected':''}>${o}</option>`).join('')}</select><label>Policía avisada</label><select data-k="exPol" ${D}>${['','Sí','No','No procede'].map(o=>`<option ${d.exPol===o?'selected':''}>${o}</option>`).join('')}</select><label>Familia informada</label><select data-k="exFam" ${D}>${['','Sí','No','Sin familia presente'].map(o=>`<option ${d.exFam===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="hd">Médico con firma</div><div class="box">${sigHTML(p,'exitus')}</div>`},
 reg(p){const f=S.regF||{vit:1,int:1,neu:1};const C=(k,l)=>ck(p,'x',l,{on:!!f[k],dis:false}).replace('data-opt="1"',`data-act="regF" data-k="${k}"`);
  return `<div style="display:grid;grid-template-columns:200px 1fr;gap:8px" class="regw"><div style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;gap:4px"><button class="bb ${S.regT?'dk':''}" data-act="regT" data-v="1" style="font-size:20px;flex:1">▦</button><button class="bb ${S.regT?'':'dk'}" data-act="regT" data-v="0" style="font-size:20px;flex:1">⤴</button></div>${C('vit','Datos Vitales')}${C('int','INTERVENCIONES')}${C('neu','Neurología')}${C('cir','Circulación')}${C('otr','Otro')}</div><div style="overflow-x:auto">${S.regT?regTable(p,f):regChart(p,f)}</div></div><div class="warn">Las constantes del monitor llegan con al menos 30 s de retraso respecto al equipo.</div>`},
 tras(p){const d=p.d,D=dis(p);return `<div class="tip">Ventanas de traslado y entrega no fotografiadas: reconstruidas a partir del manual.</div><div class="hd">Destino del paciente</div><div class="box grid">${DESTINOS.map(v=>ck(p,'x',v,{on:d.destino===v}).replace('data-opt="1"',`data-act="setK" data-k="destino" data-v="${esc(v)}"`)).join('')}</div>
  ${d.destino==='No traslado'?`<div class="hd">Motivo de no traslado</div><div class="box grid">${['Exitus in situ','Rechazo del paciente','Resuelto in situ','Alta a domicilio','Otros'].map(v=>ck(p,'x',v,{on:d.noTras===v}).replace('data-opt="1"',`data-act="setK" data-k="noTras" data-v="${v}"`)).join('')}</div>`:''}
  <div class="hd">Transporte</div><div class="box grid">${['Con prioritarios','Sin prioritarios','Decúbito supino','Semisentado','Decúbito lateral','Sedestación'].map(v=>ck(p,'tr',v)).join('')}</div>`},
 ent(p){const d=p.d,D=dis(p);return `<div class="hd">Paciente transferido a</div><div class="box grid">${['Médico de urgencias','Enfermería de urgencias','Otro recurso sanitario','Familiar / acompañante','Fuerzas de seguridad'].map(v=>ck(p,'x',v,{on:d.recibe===v}).replace('data-opt="1"',`data-act="setK" data-k="recibe" data-v="${v}"`)).join('')}</div>
  <div class="frm" style="margin-top:6px"><label>Hora de transferencia</label><div style="display:flex;gap:4px"><button class="clk" data-act="now" data-k="hTransf" ${D}>🕒</button><input type="time" data-k="hTransf" value="${esc(d.hTransf)}" ${D}></div></div>
  <div class="hd">Estado a la entrega ${p.closed?'':'<button class="bb" style="float:right;min-height:24px;padding:0 8px" data-act="copyReg">⧉ Copiar del Registro</button>'}</div><div class="box"><div style="display:flex;flex-wrap:wrap;gap:8px">${[['eTas','TAS'],['eTad','TAD'],['eFc','FC'],['eSpo2','SpO₂'],['eGcs','GCS']].map(([k,l])=>`<label style="font-size:13px">${l}<br><input type="number" data-k="${k}" value="${esc(d[k])}" style="width:80px" ${D}></label>`).join('')}</div>
  <div class="grid" style="margin-top:6px">${['Estable','Mejoría','Sin cambios','Empeoramiento'].map(v=>ck(p,'x',v,{on:d.sitEnt===v}).replace('data-opt="1"',`data-act="setK" data-k="sitEnt" data-v="${v}"`)).join('')}</div>
  <div class="frm" style="margin-top:6px"><label>Objetos de valor entregados</label><input data-k="objetos" value="${esc(d.objetos)}" ${D}></div></div>`}
};
function neuroPanel(p,s){const id=s.id,d=p.d,D=dis(p);const g=k=>d[id+'_'+k];
 const eye=side=>{const v=g('p'+side)||'Normal';const size={Normal:9,Miosis:4,Midriasis:14,Arreactiva:14}[v];return `<div style="text-align:center"><button class="eye" style="--p:${size}px" data-act="eye" data-id="${id}" data-s="${side}" ${D}><i>${side}</i></button><div class="small">${v}</div></div>`};
 const G=(k,l,o)=>`<div class="small" style="margin-top:6px">${l}</div><div class="grid" style="grid-template-columns:repeat(${o.length},1fr)">${o.map(([n,t])=>ck(p,'x',n+' '+t,{on:String(g(k))===String(n)}).replace('data-opt="1"',`data-act="gcs" data-id="${id}" data-k="${k}" data-v="${n}"`)).join('')}</div>`;
 return `<div class="cols"><div><div class="box" style="display:flex;justify-content:space-between;align-items:flex-start;background:#fff;min-height:200px">${eye('R')}<svg viewBox="0 0 120 240" width="120" style="opacity:.8"><circle cx="60" cy="22" r="16" fill="#bbb"/><rect x="40" y="40" width="40" height="80" rx="10" fill="#bbb"/><rect x="22" y="44" width="14" height="72" rx="7" fill="#bbb"/><rect x="84" y="44" width="14" height="72" rx="7" fill="#bbb"/><rect x="42" y="122" width="16" height="100" rx="8" fill="#bbb"/><rect x="62" y="122" width="16" height="100" rx="8" fill="#bbb"/></svg>${eye('L')}</div>${ck(p,'x','motórico/pupila normal',{on:!!g('normal')}).replace('data-opt="1"',`data-act="neuroNorm" data-id="${id}"`)}<div class="small">Toca cada ojo para cambiar el estado de la pupila.</div></div>
 <div><div class="hd">Estado de Consciencia-AVDN</div><div class="box grid" style="grid-template-columns:repeat(2,1fr)">${['Alerta','Respuesta a la voz','Respuesta al dolor','No reacciona/ Inconsciente'].map(v=>ck(p,'x',v,{on:g('avdn')===v}).replace('data-opt="1"',`data-act="avdn" data-id="${id}" data-v="${v}"`)).join('')}</div>

 }

 if(Q.includes(v)){if(qsel.length&&!qsel.includes(v))return true;if(details.length&&!['PCR','No Respira','Estable'].includes(v))return true;return false}
